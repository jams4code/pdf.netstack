name: Release

# Push a tag such as v1.0.0 (or v1.1.0-preview.1) to publish all three packages to NuGet.
#
# Authentication, in order of preference:
# - Trusted publishing: a policy on nuget.org for this repository and this workflow file, and
#   the NUGET_USER repository secret holding the nuget.org account name. No stored API key.
# - Otherwise the NUGET_API_KEY repository secret.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Changelog entry
        run: |
          # The section for this version, without its heading. Fails the release if it is missing.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Build
        run: dotnet build PdfNetStack.sln -c Release -p:Version=${VERSION}

      - name: Test
        run: dotnet test PdfNetStack.sln -c Release --no-build

      - name: License check
        shell: pwsh
        run: ./eng/check-licenses.ps1

      - name: Pack
        run: dotnet pack PdfNetStack.sln -c Release --no-build -o artifacts -p:Version=${VERSION}

      - name: NuGet login (trusted publishing)
        if: env.NUGET_API_KEY == ''
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        env:
          KEY: ${{ steps.login.outputs.NUGET_API_KEY || env.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "PdfNetStack $VERSION" --notes-file release-notes.md "${flags[@]}"
