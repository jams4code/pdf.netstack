name: Release

# Push a tag such as v1.0.0 (or v1.1.0-preview.1) to publish every package in the solution to NuGet.
#
# Authentication, in order of preference:
# - Trusted publishing: a policy on nuget.org for this repository, this workflow file and the
#   production environment, and the NUGET_USER secret holding the nuget.org user name (the
#   profile name, not the email). No stored API key.
# - Otherwise the NUGET_API_KEY repository secret.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  cli:
    # The command line tool compiled ahead of time for each platform: one self-contained
    # executable, no .NET install needed. The publish job attaches them to the GitHub release,
    # so they ship only when everything else does.
    strategy:
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: win-x64, os: windows-latest }
          - { rid: osx-x64, os: macos-latest }
          - { rid: osx-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Native AOT publish (no trim or AOT warnings allowed)
        run: dotnet publish src/PdfNetStack.Cli -c Release -f net10.0 -r ${{ matrix.rid }} -p:NativeAot=true -p:Version=${VERSION} -o publish

      - name: Name the binary
        run: |
          ext=""
          [[ "${{ matrix.rid }}" == win-* ]] && ext=".exe"
          mkdir dist
          cp "publish/PdfNetStack.Tool${ext}" "dist/pdfnetstack-${VERSION}-${{ matrix.rid }}${ext}"
          echo "BINARY=dist/pdfnetstack-${VERSION}-${{ matrix.rid }}${ext}" >> "$GITHUB_ENV"

      - name: Smoke test
        # osx-x64 is cross compiled on an arm64 runner and cannot run there.
        if: matrix.rid != 'osx-x64'
        run: |
          "./${BINARY}" --help
          "./${BINARY}" inspect tests/PdfNetStack.Tests/Fixtures/Forms/form.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: cli
    runs-on: ubuntu-latest
    # Must match the environment in the nuget.org trusted publishing policy.
    environment: production
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Changelog entry
        run: |
          # The section for this version, without its heading. Fails the release if it is missing.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Build
        run: dotnet build PdfNetStack.sln -c Release -p:Version=${VERSION}

      - name: Test
        run: dotnet test PdfNetStack.sln -c Release --no-build

      - name: License check
        shell: pwsh
        run: ./eng/check-licenses.ps1

      - name: Pack
        run: dotnet pack PdfNetStack.sln -c Release --no-build -o artifacts -p:Version=${VERSION}

      - name: NuGet login (trusted publishing)
        if: env.NUGET_API_KEY == ''
        id: login
        # Pinned to a commit: this job can publish packages. Dependabot keeps the pin current.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        env:
          KEY: ${{ steps.login.outputs.NUGET_API_KEY || env.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Command line binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: cli
          merge-multiple: true

      - name: Checksums
        working-directory: cli
        run: |
          sha256sum pdfnetstack-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" artifacts/* cli/* --title "PdfNetStack $VERSION" --notes-file release-notes.md "${flags[@]}"
