name: Corpus benchmark

# Downloads the public benchmark corpus (eng/corpus/manifest.json: public domain and openly
# licensed documents, never committed), runs tools/corpus_bench.py over it and uploads the
# Markdown and JSON report. Runs weekly, on demand, and for every version tag: then the report is
# attached to the GitHub release with a comparison against the previous release's report
# (tools/corpus_compare.py), so a regression in size, time or memory shows next to the release.
# There is no pull_request trigger, so pull requests, from forks or not, never run it; the
# repository check keeps forks' schedules off.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: corpus
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.repository == 'jams4code/pdf.netstack'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CORPUS_CACHE: ${{ github.workspace }}/artifacts/corpus/files
      CORPUS_REPORT: ${{ github.workspace }}/artifacts/corpus/report
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the render check
        run: python -m pip install pypdfium2==5.13.0 numpy==2.2.2

      # The cache is keyed on the manifest, so a changed entry downloads again. Restore and save
      # are separate steps so a run that reports failures still keeps its downloads.
      - name: Restore the corpus
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CORPUS_CACHE }}
          key: corpus-${{ hashFiles('eng/corpus/manifest.json') }}
          restore-keys: corpus-

      - name: Fetch the corpus
        id: fetch
        continue-on-error: true
        run: python tools/fetch_corpus.py --cache "$CORPUS_CACHE"

      - name: Save the corpus
        if: steps.restore.outputs.cache-hit != 'true' && steps.fetch.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CORPUS_CACHE }}
          key: corpus-${{ hashFiles('eng/corpus/manifest.json') }}

      - name: Build the runner
        run: dotnet build tools/PdfNetStack.CorpusRunner -c Release

      - name: Run the benchmark
        run: python tools/corpus_bench.py --cache "$CORPUS_CACHE" --out "$CORPUS_REPORT" --jobs 4

      - name: Job summary
        if: always()
        run: |
          if [ -f "$CORPUS_REPORT/report.md" ]; then cat "$CORPUS_REPORT/report.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-report
          path: |
            artifacts/corpus/report/report.md
            artifacts/corpus/report/report.json
          retention-days: 90
          if-no-files-found: warn

      - name: Fail when a download failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Some corpus files could not be fetched or changed upstream; see the Fetch the corpus step."
          exit 1

  compare:
    # Runs the same corpus through qpdf, MuPDF and Ghostscript next to PdfNetStack
    # (tools/compare_optimizers.py) and scores each output on size, rendering and what it kept.
    if: github.repository == 'jams4code/pdf.netstack'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CORPUS_CACHE: ${{ github.workspace }}/artifacts/corpus/files
      COMPARE_REPORT: ${{ github.workspace }}/artifacts/compare
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the render check and the other optimizers
        run: |
          python -m pip install pypdfium2==5.13.0 numpy==2.2.2
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf mupdf-tools ghostscript

      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CORPUS_CACHE }}
          key: corpus-${{ hashFiles('eng/corpus/manifest.json') }}
          restore-keys: corpus-

      - name: Fetch the corpus
        run: python tools/fetch_corpus.py --cache "$CORPUS_CACHE"

      - name: Build the command line tool
        run: dotnet build src/PdfNetStack.Cli -c Release

      - name: Compare
        run: python tools/compare_optimizers.py --cache "$CORPUS_CACHE" --out "$COMPARE_REPORT" --jobs 4

      - name: Job summary
        if: always()
        run: |
          if [ -f "$COMPARE_REPORT/compare.md" ]; then cat "$COMPARE_REPORT/compare.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-report
          path: |
            artifacts/compare/compare.md
            artifacts/compare/compare.json
          retention-days: 90
          if-no-files-found: warn

  release:
    # Attaches the report of a version tag to its release, with the comparison. The release itself
    # is created by the Release workflow; this job waits for it.
    needs: benchmark
    if: always() && startsWith(github.ref, 'refs/tags/v') && github.repository == 'jams4code/pdf.netstack'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: corpus-report
          path: report

      - name: Compare with the previous release
        run: |
          previous=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -v -x "$TAG" | grep -v -- '-' | head -n 1 || true)
          mkdir -p previous
          if [ -n "$previous" ] && gh release download "$previous" --pattern corpus-report.json --dir previous 2>/dev/null; then
            python3 tools/corpus_compare.py previous/corpus-report.json report/report.json \
              --previous-label "$previous" --current-label "$TAG" --out report/comparison.md
          else
            printf '# Corpus benchmark: %s\n\nNo report is attached to a previous release, so there is nothing to compare with.\n' "$TAG" > report/comparison.md
          fi
          cat report/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach to the release
        run: |
          for i in $(seq 1 60); do
            gh release view "$TAG" > /dev/null 2>&1 && break
            sleep 60
          done
          cp report/report.md corpus-report.md
          cp report/report.json corpus-report.json
          cp report/comparison.md corpus-comparison.md
          gh release upload "$TAG" corpus-report.md corpus-report.json corpus-comparison.md --clobber
