name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build PdfNetStack.sln -c Release

      - name: Test (.NET 8 and .NET 10)
        run: dotnet test PdfNetStack.sln -c Release --no-build

      - name: License check
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./eng/check-licenses.ps1

      - name: Native AOT publish (no trim or AOT warnings allowed)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet publish src/PdfNetStack.Cli -c Release -f net10.0 -r linux-x64 -p:NativeAot=true -o aot
          ./aot/PdfNetStack.Tool --help

      # The OCR models package packs the model files, which are never committed. Packing fails if
      # one is missing or does not match its pinned SHA-256.
      - name: Cache the OCR models
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: src/PdfNetStack.Ocr.Models/models
          key: ocr-models-${{ hashFiles('tools/fetch_ocr_models.py') }}

      - name: Fetch the OCR models
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/fetch_ocr_models.py src/PdfNetStack.Ocr.Models/models

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack PdfNetStack.sln -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: packages
          path: artifacts/*

  # The libraries as a serverless host runs them: compiled ahead of time, invariant globalization.
  # The smoke app roots all three libraries, so any trimming or AOT warning anywhere in them fails
  # the publish, then it creates, opens, optimizes, extracts text from and converts HTML to PDF.
  aot-smoke:
    name: Native AOT smoke test (${{ matrix.rid }}, ${{ matrix.framework }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        framework: [net8.0, net10.0]
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish (no trim or AOT warnings allowed)
        run: dotnet publish tests/PdfNetStack.AotSmoke -c Release -f ${{ matrix.framework }} -r ${{ matrix.rid }} -o aot-smoke

      - name: Run
        run: ./aot-smoke/PdfNetStack.AotSmoke

      - name: Cold start
        run: python3 tools/measure_cold_start.py --app aot-smoke/PdfNetStack.AotSmoke --runs 3

  # Serverless and container images often run without ICU, and servers run under any culture.
  globalization:
    name: Tests under invariant globalization and tr-TR
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build tests/PdfNetStack.Tests -c Release

      - name: Test with invariant globalization
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
        run: dotnet test tests/PdfNetStack.Tests -c Release --no-build -f net10.0

      - name: Test under tr-TR
        env:
          PDFNETSTACK_TEST_CULTURE: tr-TR
        run: dotnet test tests/PdfNetStack.Tests -c Release --no-build -f net10.0

  # Build only: the samples deploy nothing.
  samples:
    name: Serverless samples
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build samples/serverless/Serverless.sln -c Release
